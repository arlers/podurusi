<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Подуруси</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #ffffff;
      font-family: 'Georgia', serif;
      text-align: center;
    }
    h1 {
      font-size: 5rem;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff9a9e, #fecfef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    img {
      max-width: 90vw;
      max-height: 65vh;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 3px solid #333;
    }
    p {
      margin-top: 1.5rem;
      opacity: 0.8;
      font-style: italic;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Подуруси</h1>
  <img src="podurusi.jpg" alt="Мы">
  <p>Наше семейное слово, которого нет в поиске</p>
</body>
</html>
