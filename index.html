<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Подуруси</title>
  <meta name="google-site-verification" content="chRSlSZBoPwbOSetDcAgdGWzMtJtfUWZJh8tixSQCZY" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #d0f0c0;
      color: #ffffff;
      font-family: 'Georgia', serif;
      text-align: center;
    }
    h1 {
      font-size: 5rem;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      text-transform: uppercase;
      color: #ff9a9e;
    }
    img {
      max-width: 90vw;
      max-height: 65vh;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 3px solid #333;
    }
    p {
      margin-top: 1.5rem;
      font-style: italic;
      font-size: 2.5rem;
      color: #ff9a9e;
    }
       /* Стили для нарисованного котика */
    .cat-drawing {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .cat-drawing:hover {
      transform: scale(1.1) rotate(-5deg);
    } 
  </style>
</head>
<body>
  <h1>Подуруси</h1>
  <img src="podurusi.jpg" alt="Мы">
    <!-- Наш нарисованный котик -->
  <svg class="cat-drawing" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Уши -->
    <polygon points="20,40 35,10 50,35" fill="#ff9a9e" />
    <polygon points="80,40 65,10 50,35" fill="#ff9a9e" />
    <!-- Голова -->
    <circle cx="50" cy="55" r="30" fill="#ff9a9e" />
    <!-- Глазки -->
    <circle cx="38" cy="50" r="4" fill="#1a1a1a" />
    <circle cx="62" cy="50" r="4" fill="#1a1a1a" />
    <!-- Носик -->
    <polygon points="47,60 53,60 50,64" fill="#1a1a1a" />
    <!-- Ротик (две дуги) -->
    <path d="M 40 68 Q 45 75 50 64 Q 55 75 60 68" stroke="#1a1a1a" stroke-width="2" fill="transparent" />
    <!-- Усы -->
    <line x1="20" y1="60" x2="35" y2="62" stroke="#1a1a1a" stroke-width="1.5" />
    <line x1="20" y1="68" x2="35" y2="66" stroke="#1a1a1a" stroke-width="1.5" />
    <line x1="80" y1="60" x2="65" y2="62" stroke="#1a1a1a" stroke-width="1.5" />
    <line x1="80" y1="68" x2="65" y2="66" stroke="#1a1a1a" stroke-width="1.5" />
  </svg>
  <p>Люблю тебя</p>
</body>
</html>
